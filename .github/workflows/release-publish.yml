# When a release tag is pushed, create and publish operator images on GitHub
# Registry. Then generate a release on GitHub.
name: release-publish

on:
  push:
    tags:
      - v*

permissions: read-all

env:
  REGISTRY: "ghcr.io"

jobs:

  check-version:
    name: Evaluate release tag
    runs-on: ubuntu-26.04
    outputs:
      is_latest: ${{ steps.check-release.outputs.is_latest }}
      is_stable: ${{ steps.check-release.outputs.is_stable }}
      is_rc: ${{ steps.check-release.outputs.is_rc }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # To identify the commit we need the history and all the tags.
          fetch-depth: 0
      -
        name: Check release version
        id: check-release
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          # A fork release is the upstream version it is based on, followed
          # by its own sequence number: 1.30.1-1, 1.30.1-2, ...
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::v${tag} is not a fork release tag (vX.Y.Z-N)"
            exit 1
          fi
          is_latest="false"
          is_stable="true"
          is_rc="false"
          echo "is_latest=${is_latest}" >> $GITHUB_OUTPUT
          echo "is_stable=${is_stable}" >> $GITHUB_OUTPUT
          echo "is_rc=${is_rc}" >> $GITHUB_OUTPUT

  release:
    name: Create Github release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    needs:
      - check-version
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release notes list the commits since the upstream tag.
          fetch-depth: 0
      -
        name: Get tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${tag#v}"
          echo "TAG=${tag}" >> $GITHUB_ENV
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "BASE=v${version%-*}" >> $GITHUB_ENV
      -
        name: Generate release notes
        env:
          TAG: ${{ env.TAG }}
          BASE: ${{ env.BASE }}
        run: |
          # the fork carries no upstream tag: fetch the one this release is based on
          git fetch --no-tags https://github.com/cloudnative-pg/cloudnative-pg.git "refs/tags/${BASE}:refs/tags/${BASE}"
          {
            echo "## Version ${TAG}"
            echo
            echo "Upstream CloudNativePG ${BASE}, with these changes:"
            echo
            git log --reverse --no-merges --format='- %s' "${BASE}..v${TAG}"
          } > release_notes.md
      -
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # See https://github.blog/security/supply-chain-security/safeguard-container-signing-capability-actions/
        # and https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml for more details on
        # how to use cosign.
      -
        name: Sign yaml files
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          cosign sign-blob "releases/cnpg-${VERSION}.yaml" \
          --bundle "releases/cnpg-${VERSION}.sigstore.json" --yes
      -
        name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release_notes.md
          draft: false
          name: v${{ env.TAG }}
          files: |
            releases/cnpg-${{ env.VERSION }}.yaml
            releases/cnpg-${{ env.VERSION }}.sigstore.json
          make_latest: ${{ needs.check-version.outputs.is_latest == 'true' && needs.check-version.outputs.is_stable == 'true' }}
          prerelease: ${{ needs.check-version.outputs.is_stable == 'false' || needs.check-version.outputs.is_rc == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-binaries:
    name: Build containers
    runs-on: ${{ github.repository_owner == 'cloudnative-pg' && 'ubuntu-latest-16-cores' || 'ubuntu-24.04' }}
    permissions:
      packages: write
      contents: write
      id-token: write
    needs:
      - check-version
    outputs:
      version: ${{ env.IMAGE_TAG }}
      author_name: ${{ steps.build-meta.outputs.author_name }}
      author_email: ${{ steps.build-meta.outputs.author_email }}
      platforms: ${{ env.PLATFORMS }}
      olm_img: ${{ steps.olm-image.outputs.olm_image }}
      hashes: ${{ steps.hashes.outputs.hashes }}
      images_matrix: ${{ steps.images_matrix.outputs.images_matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # To identify the commit we need the history and all the tags.
          fetch-depth: 0
      -
        name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      -
        name: Build meta
        id: build-meta
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          commit_sha="${COMMIT_SHA}"
          commit_date=$(git log -1 --pretty=format:'%ad' --date short "${commit_sha}")
          tag="${GITHUB_REF#refs/tags/v}"

          # get git user and email
          author_name=$(git show -s --format='%an' "${commit_sha}" | head -n1)
          author_email=$(git show -s --format='%ae' "${commit_sha}" | head -n1)

          # The version is the tag: git describe would read the fork
          # sequence number of 1.30.1-1 as a count of commits (1.30.1-dev1)
          commit_version="${tag}"
          commit_short=$(git rev-parse --short "${commit_sha}")

          echo "DATE=${commit_date}" >> $GITHUB_ENV
          echo "VERSION=${commit_version}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${tag}" >> $GITHUB_ENV
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "COMMIT=${commit_short}" >> $GITHUB_ENV
          echo "author_name=${author_name}" >> $GITHUB_OUTPUT
          echo "author_email=${author_email}" >> $GITHUB_OUTPUT
      -
        name: Set GoReleaser environment
        run: |
          echo GOPATH=$(go env GOPATH) >> $GITHUB_ENV
          echo PWD=$(pwd) >> $GITHUB_ENV
      -
        name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      -
        name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2
          args: release --clean --timeout 60m
        env:
          DATE: ${{ env.DATE }}
          COMMIT: ${{ env.COMMIT }}
          VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build checksum file
        id: hashes
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        shell: bash
        run: |
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> "$GITHUB_OUTPUT"

      -
        name: Detect platforms
        run: |
          # Keep in mind that adding more platforms (architectures) will increase the building
          # time even if we use the ghcache for the building process.
          platforms="linux/amd64,linux/arm64"
          echo "PLATFORMS=${platforms}" >> $GITHUB_ENV
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: ${{ env.PLATFORMS }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      -
        name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        id: bake-push
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          environment: "production"
          buildVersion: ${{ env.VERSION }}
          tag: ${{ env.IMAGE_TAG }}
          registry: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}
          revision: ${{ env.COMMIT }}
          latest: ${{ needs.check-version.outputs.is_latest == 'true' && needs.check-version.outputs.is_stable == 'true' }}
        with:
          source: .
          push: true
          no-cache: true
          targets: "default"
      -
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # See https://github.blog/security/supply-chain-security/safeguard-container-signing-capability-actions/
        # and https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml for more details on
        # how to use cosign.
      -
        name: Sign images
        env:
          BAKE_METADATA: ${{ steps.bake-push.outputs.metadata }}
        run: |
          images=$(echo "${BAKE_METADATA}" |
            jq -r '.[] | (."image.name" | sub(",.*";"" )) + "@" + ."containerimage.digest"'
          )
          cosign sign --yes ${images}
      -
        # Bake returns all the tags for a target's variant in a comma separated list.
        # We only care about a single tag for OLM, so we remove the "latest" tag and
        # pick the first entry in order from what's left in the list
        name: Image for OLM
        id: olm-image
        env:
          ubi_tags: ${{ fromJSON(steps.bake-push.outputs.metadata)['ubi']['image.name'] }}
        run: |
          echo "olm_image=$(echo "$ubi_tags" | tr ',' '\n' | grep -v 'latest' | sed 's/^ *//g' | head -n 1)" >> $GITHUB_OUTPUT
      -
        name: Prepare images matrix
        id: images_matrix
        env:
          BAKE_METADATA: ${{ steps.bake-push.outputs.metadata }}
        shell: bash
        run: |
          images_matrix=$(echo "$BAKE_METADATA" |
            jq -r -c '
              del(.[].["containerimage.descriptor", "buildx.build.ref"])
              | to_entries
              | map({variant: .key} + .value + {"image.name": (.value["image.name"] | split(",")[0] | sub(":[^/]+$"; ""))})
            '
          )
          echo "images_matrix=${images_matrix}" >> "$GITHUB_OUTPUT"

  provenance-binaries:
    name: Add provenance to binaries
    needs:
      - release-binaries
    permissions:
      actions: read
      id-token: write
      contents: write
    # NOTE: pinned by tag, not SHA — the SLSA generator's builder-fetch.sh
    # resolves the binary download URL from the git ref and breaks with SHA pins.
    # See: https://github.com/slsa-framework/slsa-github-generator/issues/4216
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release-binaries.outputs.hashes }}"
      upload-assets: true

  provenance-images:
    name: Provenance for images
    needs:
      - release-binaries
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.release-binaries.outputs.images_matrix) }}
    # NOTE: pinned by tag, not SHA — see comment on provenance-binaries above.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix['image.name'] }}
      digest: ${{ matrix['containerimage.digest'] }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}


  olm-bundle:
    name: Create OLM bundle and catalog
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    needs:
      - check-version
      - release-binaries
    if: |
      (always() && !cancelled()) &&
      needs.release-binaries.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: ${{ needs.release-binaries.outputs.platforms }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set bundle variables
        env:
          OLM_IMG: ${{ needs.release-binaries.outputs.olm_img }}
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "CONTROLLER_IMG=${OLM_IMG}" >> $GITHUB_ENV
          echo "BUNDLE_IMG=${OLM_IMG}-bundle" >> $GITHUB_ENV
          echo "CATALOG_IMG=${OLM_IMG}-catalog" >> $GITHUB_ENV

      - name: Create bundle
        env:
          CONTROLLER_IMG: ${{ env.CONTROLLER_IMG }}
          BUNDLE_IMG: ${{ env.BUNDLE_IMG }}
          CATALOG_IMG: ${{ env.CATALOG_IMG }}
        run: |
          # opm requires registries.conf in v2 format; the runner default may be v1.
          # Override with a v2 file matching the runner's search registries.
          REGCONF="${RUNNER_TEMP}/registries.conf"
          printf 'unqualified-search-registries = ["docker.io", "quay.io"]\n' > "${REGCONF}"
          export CONTAINERS_REGISTRIES_CONF="${REGCONF}"
          make olm-catalog VERSION="${VERSION}"

      - name: Archive the bundle manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle
          path: |
            bundle.Dockerfile
            bundle/
            cloudnative-pg-catalog.yaml

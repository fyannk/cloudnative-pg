apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cnpg
spec:
  channel: stable-v1
  config:
    env:
    - name: CLUSTER_WIDE_CACHE_FILTER
      value: "false"
    - name: HTTP_PROXY
      value: http://proxy.example.com:3128
    - name: HTTPS_PROXY
      value: http://proxy.example.com:3128
    - name: NO_PROXY
      value: localhost,127.0.0.1,.svc,.cluster.local
    - name: DEFAULT_STORAGE_CLASS
      value: awesome-storage-class
  name: cloudnative-pg
  source: cnpg
  sourceNamespace: olm
  installPlanApproval: Automatic


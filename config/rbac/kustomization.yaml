apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- role.yaml
- role_binding.yaml

# For each CRD, "Editor" and "Viewer" roles are scaffolded by
# default, aiding admins in cluster management. Those roles are
# not used by the Project itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- subscription_editor_role.yaml
- subscription_viewer_role.yaml
- publication_editor_role.yaml
- publication_viewer_role.yaml
- database_editor_role.yaml
- database_viewer_role.yaml
# Roles for the scale and status subresources, granted to nobody until bound
# or labelled for aggregation (see the "Roles for the subresources" section of
# docs/src/security.md).
- scale_editor_role.yaml
- cluster_status_editor_role.yaml

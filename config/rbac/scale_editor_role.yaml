# permissions to scale clusters and poolers through their scale subresource,
# aggregated to the built-in edit and admin roles once labelled (see the
# "Roles for the subresources" section of security.md)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-pg-kubebuilderv4
    app.kubernetes.io/managed-by: kustomize
  name: scale-editor-role
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters/scale
  - poolers/scale
  verbs:
  - get
  - patch
  - update
